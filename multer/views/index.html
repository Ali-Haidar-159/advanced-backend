<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
    <!-- Milligram CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/milligram@1.4.1/dist/milligram.min.css">
    <style>
        body {
            margin-top: 60px;
        }
        .upload-container {
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container upload-container">
        <h1>File Upload</h1>
        <form action="/user/signup" method="POST" enctype="multipart/form-data">
            
            <label for="file1">File 1</label>
            <input type="file" id="file1" name="avatar" >

            <label for="file2">File 2</label>
            <input type="file" id="file2" name="doc">

            <button type="submit" class="button-primary">Upload Files</button>
        </form>
    </div>
</body>
</html>
